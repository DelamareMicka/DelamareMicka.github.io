# Maquette pédagogique — programme IA (CESI)
# Généré à partir des fiches UE officielles (DATA/*.docx).
# Volontairement exclus : noms d'enseignants, heures CM/TD/TP/Projet détaillées, statut docteur/non-docteur (données internes RH).
# prereq_matches : détection automatique par correspondance de mots-clés entre le texte des
# prérequis et les titres des ECUE antérieurs (heuristique, à vérifier -- pas un lien officiel).
semesters:
- number: 1
  ues:
  - code: '1.1'
    num: 1
    title: Définir le besoin pour répondre à une problématique industrielle d’un projet Intelligence Artificielle
    ects: 10
    heures: 126
    themes: Ce programme intègre la logique formelle et l'algèbre booléenne pour modéliser des problèmes complexes, tout en s'appuyant sur l'algèbre linéaire et l'analyse vectorielle pour le calcul scientifique. Il combine la maîtrise théorique des fonctions et des intégrales avec l'implémentation rigoureuse de structures de données avancées (arbres, graphes) en C et Python. L'objectif est de concevoir des solutions optimisées en évaluant précisément la complexité algorithmique et la gestion mémoire. Cette synergie entre mathématiques fondamentales et informatique technique permet de résoudre des problématiques d'ingénierie logicielle de haut niveau.
    competences:
    - Analyser le besoin du client, le contexte économique, l'environnement, la technicité et les métiers de l'entreprise afin d'appréhender le périmètre du projet
    - Identifier et analyser les flux d'information et les processus et activités de l'entreprise afin de comprendre le schéma d'organisation métier
    - Utiliser ses connaissances scientifiques pour vérifier et/ou identifier les causes d'un dysfonctionnement
    - Utiliser les statistiques pour optimiser la solution IA
    - Etablir un diagnostic afin de trouver les raisons d'un dysfonctionnement
    - Recenser les différentes solutions/technologies susceptibles de répondre au cahier des charges
    - Comparer les solutions existantes avec leur adéquation au besoin afin de participer aux choix techniques
    - Analyser et évaluer les risques (sécurité) d'une IA afin de participer à leur résolution
    - Rechercher des solutions techniques et réaliser une veille pour répondre à la problématique IA
    - Comparer les solutions qui répondent aux besoins afin de participer aux choix techniques
    - Construire et exposer tous les éléments permettant la prise de décision
    - S'approprier les différentes classes d'algorithmes (ML, DL,…) pour modéliser les données massives
    - Mettre en œuvre des méthodes de collecte, de stockage, de traitement et de visualisation des données
    - Appréhender les concepts d'architecture cloud (AWS, Azure,…) et les outils d'apprentissage (Keras, TF, etc.)
    - Conduire une veille technologique pour repérer les nouvelles applications et les évolutions
    ecues:
    - code: 1.1.1
      title: Calcul des Prédicats & Logique Formelle
      heures: 35
      coefficient: 1
      prerequis: Programme de terminale
      objectifs:
      - Base fondamentale du raisonnement logique utilisé par les ordinateurs et les Intelligences Artificielles, elle consiste en l’appréhension du concept de logique sans interprétation du contenu des propositions.
      - L’objectif est de mettre en avant la différence entre une logique humaine et celle d’une machine afin de mieux comprendre les raisonnements des IA.
      prereq_matches: []
    - code: 1.1.2
      title: Représentation Binaire et Algèbre Booléenne
      heures: 14
      coefficient: 1
      prerequis: Aucun prérequis
      objectifs:
      - Base fondamentale de l'informatique au sens large, la logique de Boole permet de réaliser l'ensemble des tâches des ordinateurs. En utilisant des règles simples, il est possible de construire des expressions logiques complexes et les simplifier pour obtenir des résultats souhaités. La représentation des informations et à fortiori des nombres est à la racine de l’efficacité algorithmique.
      prereq_matches: []
    - code: 1.1.3
      title: Algèbre Linéaire
      heures: 35
      coefficient: 1
      prerequis: Programme de terminal
      objectifs:
      - L'algèbre est utilisée pour résoudre des équations linéaires et pour manipuler des expressions mathématiques, ce qui est important pour calculer les valeurs de résistance, de courant, de tension et d'autres paramètres électriques.
      - 'Trigonométrie : La trigonométrie est utilisée pour étudier les ondes sinusoïdales, qui sont omniprésentes dans les circuits électriques. Les fonctions trigonométriques sont utilisées pour décrire les formes d''onde, les fréquences, les phases et les amplitudes.'
      - 'Calcul différentiel et intégral : Le calcul différentiel et intégral est utilisé pour étudier les changements de tension et de courant au fil du temps, ce qui est important pour comprendre les circuits électriques à courant alternatif.'
      - 'Analyse de Fourier : L''analyse de Fourier est utilisée pour décomposer les signaux en différentes fréquences, ce qui est utile pour comprendre les circuits qui utilisent des signaux à bande étroite, tels que les radios et les télécommunications.'
      - 'Statistiques : Les statistiques sont utilisées pour étudier les erreurs de mesure et pour déterminer la précision et la fiabilité des mesures de courant, de tension et d''autres paramètres électriques.'
      - 'Géométrie : La géométrie est utilisée pour décrire la géométrie des composants électriques tels que les résistances, les condensateurs et les inductances, et pour calculer leur capacitance, leur inductance et leur résistance.'
      prereq_matches: []
    - code: 1.1.4
      title: Analyse de Fonctions
      heures: 28
      coefficient: 1
      prerequis: Maîtrise des concepts de base du calcul différentiel et intégral, une compréhension des fonctions de plusieurs variables, ainsi qu'une familiarité avec les notions de limites et de continuité
      objectifs:
      - Fournir aux étudiants une compréhension approfondie des concepts fondamentaux de l'analyse des fonctions, allant des notions de dérivées et de limites à des applications avancées telles que les intégrales doubles et les équations aux dérivées partielles.
      prereq_matches: []
    - code: 1.1.5
      title: Structures de Données et Complexité
      heures: 14
      coefficient: 1
      prerequis: ''
      objectifs:
      - Utiliser les structures de données optimisées et savoir sur quoi elles reposent
      - Représenter des données dans une structure optimisée
      prereq_matches: []
  - code: '1.2'
    num: 2
    title: Concevoir la solution IA dans l’architecture globale
    ects: 5
    heures: 56
    themes: 'Ce programme développe une double expertise : la maîtrise de Python pour le calcul scientifique et la data science (Pandas, Matplotlib), et la rigueur du langage C pour la gestion mémoire (pointeurs, allocation dynamique) et la compilation modulaire. Il lie ces pratiques à une solide base en algorithmique, permettant de concevoir, documenter et analyser la complexité spatio-temporelle de solutions optimales (tris avancés, parcours DFS/BFS). L''accent est mis sur la modularité et le choix des structures de données adaptées pour résoudre des problèmes d''ingénierie logicielle complexes. Cette approche polyvalente garantit une compréhension profonde, du script de haut niveau à l''optimisation système.'
    competences:
    - Identifier les algos/protocoles pour une collecte efficace des données
    - Identifier la nécessité d'un prétraitement des données pour les intégrer dans la solution IA
    - Sélectionner les sources de données pour les modéliser et les cartographier
    - Identifier et exploiter les indicateurs de performance pour argumenter la solution retenue
    - Elaborer des tableaux de bord intégrant les données métier pour la prise de décision
    - Quantifier les besoins en capacité de calculs et de stockage des données
    - Identifier les ressources disponibles dans le SI
    - Appréhender les tenants et aboutissants de la solution IA
    - Définir les étapes d'un processus d'IA
    - Identifier les acteurs pour connaître l'ensemble des problématiques associées aux projets
    - Identifier les infrastructures IT nécessaires au sein de l'entreprise
    - Identifier et mettre en place des indicateurs de performance afin de choisir un modèle d'IA adapté
    - Manipuler des algorithmes sur plusieurs plateformes avec différents langages
    - Identifier et analyser les technologies appropriées pour aider à la prise de décisions
    - Mettre en œuvre la solution pour répondre aux besoins
    - Tester et valider la solution d'IA en s'appuyant sur les indicateurs de performance
    ecues:
    - code: 1.2.1
      title: Bases de la Programmation avec Python
      heures: 14
      coefficient: 1
      prerequis: Aucun prérequis
      objectifs:
      - Comprendre les fondements de la programmation et les spécificités du langage Python inclut la comparaison succincte avec d’autres langages, la notion d’environnement de développement, le paradigme impératif
      - Manipuler les types de données fondamentaux et les structures de contrôle en Python (variables, types de base, structures conditionnelles, boucles, fonctions, récursivité)
      - Utiliser les principales structures de données et modules de la bibliothèque standard (listes, dictionnaires, ensembles, tuples, itérateurs, fichiers, modules comme math, os, datetime)
      - Écrire et structurer des scripts Python pour résoudre des problèmes simples (décomposition en fonctions, lecture/écriture de fichiers, traitement de données, modularité du code)
      - Découvrir et exploiter les bibliothèques scientifiques de base de Python (initiation à numpy, pandas, matplotlib, en lien avec des cas d’usage en data science ou IA)
      prereq_matches: []
    - code: 1.2.2
      title: Algorithmes et Complexité Algorithmique
      heures: 14
      coefficient: 1
      prerequis: Aucun prérequis
      objectifs:
      - Comprendre ce qu’est un algorithme et savoir le représenter sous forme de pseudocode (inclut la notion de procédure, de déterminisme, et d’implémentation abstraite)
      - Analyser les performances d’un algorithme en termes de complexité temporelle et spatiale (maîtrise des notations asymptotiques et comparaison d’algorithmes sur base de coûts calculés)
      - Mettre en œuvre et comparer des algorithmes de tri fondamentaux (selection sort, bubble sort, insertion sort, merge sort, quick sort, avec analyse des cas optimaux/pessimistes)
      - Résoudre des problèmes algorithmiques simples sur des tableaux 1D ou 2D (calculs statistiques de base, histogrammes, recherche de chemin avec DFS/BFS dans des matrices)
      prereq_matches: []
    - code: 1.2.3
      title: Programmation en Langage C*
      heures: 28
      coefficient: 1
      prerequis: ECUE Les bases de la programmation
      objectifs:
      - Les bases de C
      - Les pointeurs
      - Workflows
      prereq_matches:
      - 1.2.1
  - code: '1.3'
    num: 3
    title: Développer et maintenir une solution d’IA pour optimiser les performances de l’entreprise en respectant une démarche éthique et écologique
    ects: 3
    heures: 35
    themes: Cette thématique porte sur la conception et l'exploitation de bases de données relationnelles à travers la méthode Merise. Elle articule la structuration rigoureuse des données (dictionnaire, dépendances fonctionnelles, formes normales) avec la modélisation conceptuelle et logique (MCD/MLD) et leur manipulation opérationnelle via le langage SQL.
    competences:
    - Déployer la solution d'IA dans un Système d'information
    - Implémenter une solution IA dans un SI existant avec des technologies et/ou langages appropriés
    - Assurer la configuration de la solution d'IA déployée
    - Mesurer et réduire les impacts environnementaux de la solution IA au regard des instances réglementaires
    - Sélectionner et formaliser les éléments de performances de la solution pour effectuer un reporting
    - Suivre la solution d'IA au sein du SI, garantir son efficacité et ses évolutions
    ecues:
    - code: 1.3.1
      title: Modélisation de Bases de Données
      heures: 14
      coefficient: 1
      prerequis: Aucun
      objectifs:
      - Appliquer la méthode Merise
      - Modèle Physique de Données
      - Modèle Conceptuel de Données
      - Modèles NoSQL (graphe, document, …)
      prereq_matches: []
    - code: 1.3.2
      title: Requêtes et Opérations sur les Bases de Données
      heures: 14
      coefficient: 1
      prerequis: Modélisation de Bases de Données
      objectifs:
      - Extraire à l’aide du langage SQL des résultats (données) à partir d'une base de données relationnelle
      - Manipuler les données au travers des différentes fonctions connues du SGBDR
      prereq_matches: []
    - code: 1.3.3
      title: Construction de Bases de Données
      heures: 7
      coefficient: 1
      prerequis: ''
      objectifs:
      - Concevoir une base de données relationnelle composée de plusieurs tables
      prereq_matches: []
  - code: '1.4'
    num: 4
    title: Organiser et piloter un projet d’intelligence artificielle et accompagner le changement numérique
    ects: 4
    heures: 56
    themes: Cette UE porte sur l'ingénierie de projets d'intelligence artificielle responsable, articulant la compréhension historique et technique de l'IA avec la rigueur de la gestion de projet. Elle impose l'intégration des cadres réglementaires et éthiques dès la phase d'analyse des besoins et de rédaction du cahier des charges.
    competences:
    - S'adapter aux méthodes de gestion de projet de type AGILE, PMI, etc. pour l'appliquer aux projets IA
    - Former les utilisateurs et/ou les mainteneurs de la solution IA pour garantir le transfert des connaissances
    - Identifier les sous-projets et tâches inclus dans le projet global pour en estimer les durées
    - Planifier les projets IA en utilisant PERT et GANTT pour construire le planning détaillé
    - Définir les principaux jalons du projet (points de validation) pour vérifier le bon déroulement
    - Concevoir le planning du projet à travers un outil de représentation graphique
    - Identifier les risques inhérents au projet IA afin d'en évaluer la criticité
    - Définir un plan de réponses aux risques identifiés et élaborer un tableau de suivi
    - Accompagner le changement numérique
    - Favoriser l'appropriation des outils numériques par les collaborateurs
    - Prendre en compte l'impact environnemental des projets afin de réduire l'empreinte carbone
    ecues:
    - code: 1.4.1
      title: Histoire de l'IA et applications
      heures: 14
      coefficient: 1
      prerequis: Connaitre les bases de l’algorithmie
      objectifs:
      - Donner une définition de l’Intelligence Artificielle
      - Comprendre l’historique de l’IA
      - Identifier les domaines et sous-domaines de l’IA
      - Identifier les champs d’application de l’IA
      - Exemple d’application en robotique (MLF), Exemple d’application en ML ?
      prereq_matches: []
    - code: 1.4.2
      title: Ethique de l'IA
      heures: 14
      coefficient: 1
      prerequis: Aucun
      objectifs:
      - Définir le mot éthique
      - Identifier les principaux enjeux sociétaux, éthiques et environnementaux liés à l’usage de l’IA.
      - Comprendre les cadres réglementaires et initiatives (RGPD, IA Act, principes éthiques de l’UE, etc.).
      - Étudier des exemples réels d'utilisation de l'intelligence artificielle en les évaluant à partir du point de vue des enjeux éthiques.
      prereq_matches: []
    - code: 1.4.3
      title: Construction d’un cahier des charges
      heures: 14
      coefficient: 1
      prerequis: Aucun
      objectifs:
      - Rédiger des cahiers des charges dans le cadre de projets informatiques
      prereq_matches: []
    - code: 1.4.4
      title: Essentiel de la gestion de projet
      heures: 14
      coefficient: 1
      prerequis: Aucun
      objectifs:
      - La gestion de projet se découvre et s’appréhende au fur et à mesure des expériences vécues. Ce module est un module d’approche. Il a pour objectif de définir les champs lexicaux, de structurer les étapes essentielles à la gestion de projet et de balayer en un temps restreint la vie d’un chef de projet informatique. Il pourrait s’apparenter à un itinéraire vu de façon rapide. L’ensemble des autres modules de ce bloc de compétences ont pour objectif d’approfondir les compétences et les connaissances
      prereq_matches: []
