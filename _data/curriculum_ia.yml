  - code: '5.3'
    num: 3
    title: Développer et maintenir une solution d’IA pour optimiser les performances de l’entreprise en respectant une démarche éthique et écologique
    title_en: Develop and maintain an AI solution to optimise company performance while respecting an ethical and ecological approach
    ects: 3
    heures: 42
    themes: Cette thématique porte sur la conception et le développement d'architectures web Full Stack, en articulant le pattern MVC et les principes d'API REST. Elle impose une maîtrise des interactions client-serveur sécurisées (PHP/PDO, Fetch API) et la mise en œuvre de mécanismes d'authentification et de protection contre les failles critiques.
