    - Implement an AI solution in an existing information system using appropriate technologies and/or languages
    - Ensure the configuration of the deployed AI solution
    - Measure and reduce the environmental impacts of the AI solution with regard to regulatory bodies
    - Select and formalise the solution's performance elements in order to produce reporting
    - Monitor the AI solution within the information system, ensuring its effectiveness and its evolution
    - Maintain the AI system in place to guarantee continuity of service
    - Configure AI solutions and master the associated metrics to validate performance
    - Use Python scripts based on dedicated AI libraries to maintain the deployed solution
    - Analyse the results of the AI solution in order to assess its ecological impact
    - Implement corrective solutions if the results are not optimal
