  - code: '2.3'
    num: 3
    title: Organiser et piloter un projet d’intelligence artificielle et accompagner le changement numérique
    title_en: Organise and manage an artificial intelligence project and support digital change
    ects: 4
    heures: 63
    themes: 'Cette thématique articule l''exploitation stratégique des données à travers la Business Intelligence et le Big Data, en couvrant l''intégralité de la chaîne de valeur : de la collecte éthique et du stockage distribué à l''analyse exploratoire et la visualisation d''indicateurs d''aide à la décision.'
    themes_en: 'This topic covers the strategic use of data through Business Intelligence and Big Data, spanning the entire value chain: from ethical collection and distributed storage to exploratory analysis and the visualisation of decision-support indicators.'
    competences:
    - S'adapter aux méthodes de gestion de projet de type AGILE, PMI, etc. pour l'appliquer aux projets IA
    - Former les utilisateurs et/ou les mainteneurs de la solution IA pour garantir le transfert des connaissances
    - Identifier les sous-projets et tâches inclus dans le projet global pour en estimer les durées
    - Planifier les projets IA en utilisant PERT et GANTT pour construire le planning détaillé
    - Définir les principaux jalons du projet (points de validation) pour vérifier le bon déroulement
    - Concevoir le planning du projet à travers un outil de représentation graphique
    - Identifier les risques inhérents au projet IA afin d'en évaluer la criticité
    - Définir un plan de réponses aux risques identifiés et élaborer un tableau de suivi
    - Accompagner le changement numérique
    - Favoriser l'appropriation des outils numériques par les collaborateurs
    - Prendre en compte l'impact environnemental des projets afin de réduire l'empreinte carbone
    - Conduire les réunions de suivi de projet en IA
    - Actualiser les données des tableaux de bord (coûts, réalisé, risques, etc.) pour réguler les aléas
    - Organiser et mener les réunions et échanges pour garantir le bon déroulement du projet
    competences_en:
    - Adapt to project management methods such as AGILE, PMI, etc. in order to apply them to AI projects
    - Train the users and/or maintainers of the AI solution to ensure knowledge transfer
    - Identify the sub-projects and tasks included in the overall project in order to estimate their durations
    - Plan AI projects using PERT and GANTT charts to build the detailed schedule
    - Define the project's main milestones (validation points) to check that it is proceeding correctly
    - Design the project schedule using a graphical representation tool
    - Identify the risks inherent in the AI project in order to assess their criticality
    - Define a response plan for the identified risks and draw up a monitoring table
    - Support digital change
    - Encourage employees to take ownership of digital tools
    - Take into account the environmental impact of projects in order to reduce the carbon footprint
    - Lead AI project follow-up meetings
    - Update dashboard data (costs, actuals, risks, etc.) to manage contingencies
    - Organise and lead meetings and discussions to ensure the project runs smoothly
    ecues:
    - code: 2.3.1
      title: Business Intelligence
      title_en: Business Intelligence
      heures: 21
      coefficient: 1
      prerequis: Aucun prérequis
      prerequis_en: No prerequisites
      objectifs:
      - Afin d'aider les futurs managers à utiliser et à comprendre l'analytique, ce cours fournit aux étudiants une base solide de l'analyse des données et de l'intelligence économique, renforcée par des exercices pratiques. Ce cours adopte une approche managériale de l'intelligence économique, en mettant l'accent sur les applications et les mises en œuvre qui se cachent derrière les concepts. Cette approche permet aux étudiants de comprendre le fonctionnement de l'analyse des données et de l'intelligence économique d'une manière qui les aidera à adopter ces technologies dans leurs futures fonctions managériales. Des cas réels seront couverts qui présentent un défi, une solution et des résultats. Chaque cas est associé à des questions permettant aux étudiants d'approfondir les détails et de réfléchir de manière critique sur le cas.
      objectifs_en:
      - To help future managers use and understand analytics, this course provides students with a solid foundation in data analysis and business intelligence, reinforced by practical exercises. The course takes a managerial approach to business intelligence, focusing on the applications and implementations behind the concepts. This approach helps students understand how data analysis and business intelligence work in a way that will help them adopt these technologies in their future managerial roles. Real-world cases will be covered, each presenting a challenge, a solution and results. Each case is accompanied by questions enabling students to explore the details further and think critically about the case.
      prereq_matches: []
    - code: 2.3.2
      title: Big Data
      title_en: Big Data
      heures: 42
      coefficient: 1
      prerequis: Bonne compréhension de la programmation en Python, une familiarité avec les bases de données et le langage SQL, une connaissance des concepts statistiques de base, une compréhension de l'algèbre linéaire, des notions de base en réseaux informatiques et architectures de stockage, ainsi qu'une introduction au machine learning.
      prerequis_en: A good understanding of programming in Python, familiarity with databases and the SQL language, knowledge of basic statistical concepts, an understanding of linear algebra, basic notions of computer networks and storage architectures, as well as an introduction to machine learning.
      objectifs:
      - Fournir aux étudiants les compétences pratiques et théoriques nécessaires pour manipuler, analyser et stocker de grandes quantités de données en utilisant des techniques et outils modernes de Big Data et de machine learning.
      objectifs_en:
      - Provide students with the practical and theoretical skills needed to handle, analyse and store large volumes of data using modern Big Data and machine learning techniques and tools.
      prereq_matches:
      - 1.1.3
      - 1.2.1
      - 1.2.3
      - 2.1.2
      - 2.2.1
