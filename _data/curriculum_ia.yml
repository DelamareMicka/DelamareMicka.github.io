    - Identify the resources available within the information system
    - Grasp the ins and outs of the AI solution
    - Define the steps of an AI process
    - Identify stakeholders in order to understand the full range of issues associated with the projects
    - Identify the IT infrastructure required within the company
    - Identify and set up performance indicators in order to choose a suitable AI model
    - Handle algorithms on several platforms using different languages
    - Identify and analyse the appropriate technologies to help with decision-making
    - Implement the solution to meet the needs
    - Test and validate the AI solution based on performance indicators
    ecues:
    - code: 5.2.1
      title: Deep Learning
      title_en: Deep Learning
      heures: 35
      coefficient: 1
      prerequis: 'Algèbre linéaire

        Programmation en python,

        Mise en place d’un environnement Jupyter notebook sous Anaconda navigator.'
      prerequis_en: 'Linear algebra

        Programming in Python,

        Setting up a Jupyter notebook environment using Anaconda Navigator.'
      objectifs:
      - Identifier les rôles des différentes parties prenantes pour comprendre leurs besoins
      - Participer à l’écriture et au maintien d’un algorithme fiable et efficace pour la mise en place d'algorithmes de deep learning
      - S’approprier les différentes classes d'algorithmes IA, leurs limites et biais et leurs applications aux données, pouvant être massives, afférentes au projet
      - Décrire les principales architectures de réseaux de neurones (réseaux entièrement connectés, réseaux de neurones convolutifs CNN, réseaux de neurones entièrement convolutifs FCN)
      - Choisir l’architecture en fonction du problème identifié.
      - Evaluer l’efficacité d’un réseau de neurones en fonction du problème identifié.
      - Programmer un réseau de neurones avec le framework TensorFlow et Keras.
      - Présenter et défendre les résultats obtenus sur un réseau de neurones.
      - Comprendre les enjeux d’un jeu de données pour le deep learning.
      - Identifier les biais d’un jeu de données.
      - Choisir une bonne répartition d’un jeu de données (entrainement, validation, test).
      - Choisir les métriques d’un réseau de neurones en fonction du problème identifié.
      - Evaluer la performance d’une architecture de réseau de neurone.
      - Identifier les cas d’applications d’un CNN/FCN dans le domaine de la santé.
      - Comprendre les principes de la segmentation sémantique.
      - 'Expliquer les différents blocs d’un CNN : Convolution, MaxPooling'
      - Décrire le fonctionnement d’un réseau entièrement Convolutif (FCN)
      - Décrire le réseau U-NET
      - Appliquer les CNN et les FCN pour la détection et la segmentation dans un cas pratique.
      objectifs_en:
      - Identify the roles of the various stakeholders in order to understand their needs
      - Contribute to the writing and maintenance of a reliable and efficient algorithm for implementing deep learning algorithms
      - Master the different classes of AI algorithms, their limitations and biases, and their application to the data — potentially massive — relevant to the project
      - Describe the main neural network architectures (fully connected networks, convolutional neural networks (CNN), fully convolutional networks (FCN))
      - Choose the architecture according to the problem identified.
      - Evaluate the effectiveness of a neural network according to the problem identified.
      - Program a neural network using the TensorFlow and Keras framework.
      - Present and defend the results obtained with a neural network.
      - Understand the challenges posed by a dataset for deep learning.
      - Identify the biases in a dataset.
      - Choose an appropriate split of a dataset (training, validation, test).
      - Choose the metrics of a neural network according to the problem identified.
      - Evaluate the performance of a neural network architecture.
      - Identify use cases for a CNN/FCN in the healthcare field.
      - Understand the principles of semantic segmentation.
      - 'Explain the different blocks of a CNN: Convolution, MaxPooling'
      - Describe how a fully convolutional network (FCN) works
      - Describe the U-NET network
      - Apply CNNs and FCNs to detection and segmentation in a practical case.
