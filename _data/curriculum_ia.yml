  ues:
  - code: '2.1'
    num: 1
    title: Définir le besoin pour répondre à une problématique industrielle d’un projet Intelligence Artificielle
    title_en: Define the need to address an industrial issue in an Artificial Intelligence project
    ects: 6
    heures: 105
    themes: Cette thématique articule l'analyse quantitative et la mise en œuvre de solutions numériques, en combinant la modélisation probabiliste et statistique pour l'aide à la décision avec le développement d'applications web dynamiques. Elle vise à transformer des données brutes en indicateurs fiables (tests d'hypothèses, lois de probabilité) intégrés au sein d'interfaces web interactives, accessibles et sécurisées.
    themes_en: This topic combines quantitative analysis with the implementation of digital solutions, bringing together probabilistic and statistical modelling for decision support with the development of dynamic web applications. It aims to turn raw data into reliable indicators (hypothesis testing, probability distributions) integrated within interactive, accessible and secure web interfaces.
    competences:
    - Utiliser ses connaissances scientifiques pour vérifier et/ou identifier les causes d'un dysfonctionnement
    - Utiliser les statistiques pour optimiser la solution IA
    - Etablir un diagnostic afin de trouver les raisons d'un dysfonctionnement
    - Recenser les différentes solutions/technologies susceptibles de répondre au cahier des charges
    - Comparer les solutions existantes avec leur adéquation au besoin afin de participer aux choix techniques
    - Analyser et évaluer les risques (sécurité) d'une IA afin de participer à leur résolution
    - Rechercher des solutions techniques et réaliser une veille pour répondre à la problématique IA
    - Comparer les solutions qui répondent aux besoins afin de participer aux choix techniques
    - Construire et exposer tous les éléments permettant la prise de décision
    - S'approprier les différentes classes d'algorithmes (ML, DL,…) pour modéliser les données massives
    - Mettre en œuvre des méthodes de collecte, de stockage, de traitement et de visualisation des données
    - Appréhender les concepts d'architecture cloud (AWS, Azure,…) et les outils d'apprentissage (Keras, TF, etc.)
    - Conduire une veille technologique pour repérer les nouvelles applications et les évolutions
    competences_en:
    - Use scientific knowledge to verify and/or identify the causes of a malfunction
    - Use statistics to optimise the AI solution
    - Establish a diagnosis in order to find the reasons for a malfunction
    - Identify the various solutions/technologies likely to meet the specifications
    - Compare existing solutions with their suitability to the need in order to contribute to technical choices
    - Analyse and assess the risks (security) of an AI in order to help resolve them
    - Research technical solutions and carry out technology watch to address the AI problem
    - Compare solutions that meet the needs in order to contribute to technical choices
    - Build and present all the elements enabling decision-making
    - Master the different classes of algorithms (ML, DL, etc.) in order to model massive data
    - Implement methods for collecting, storing, processing and visualising data
    - Grasp cloud architecture concepts (AWS, Azure, etc.) and learning tools (Keras, TF, etc.)
    - Conduct technology watch in order to identify new applications and developments
    ecues:
    - code: 2.1.1
      title: Probabilités
      title_en: Probability
      heures: 21
      coefficient: 1
      prerequis: Une compréhension solide des mathématiques de base, être familiarisé avec les notions de calcul, compétences en logique et en raisonnement, une introduction aux statistiques descriptives, et la capacité à résoudre des problèmes mathématiques et logiques.
      prerequis_en: A solid understanding of basic mathematics, familiarity with calculus concepts, skills in logic and reasoning, an introduction to descriptive statistics, and the ability to solve mathematical and logical problems.
      objectifs:
      - Fournir une compréhension approfondie des concepts fondamentaux des probabilités, de leur application à des problèmes concrets, et d'analyser des situations réelles en utilisant divers outils probabilistes et statistiques.
      objectifs_en:
      - Provide an in-depth understanding of the fundamental concepts of probability, of their application to concrete problems, and of the analysis of real-world situations using various probabilistic and statistical tools.
      prereq_matches:
      - 1.1.1
    - code: 2.1.2
      title: Statistiques
      title_en: Statistics
      heures: 28
      coefficient: 1
      prerequis: Bonne compréhension des mathématiques de base, des compétences en logique et en raisonnement, une familiarité avec les outils informatiques de base, et la capacité à résoudre des problèmes mathématiques et logiques.
      prerequis_en: A good understanding of basic mathematics, skills in logic and reasoning, familiarity with basic computing tools, and the ability to solve mathematical and logical problems.
      objectifs:
      - Développer une compréhension approfondie des statistiques descriptives, de la représentation graphique des données, des techniques d'échantillonnage, et de l'analyse des sondages, afin d'interpréter des données pour aider à la prise de décision
      objectifs_en:
      - Develop an in-depth understanding of descriptive statistics, graphical data representation, sampling techniques and survey analysis, in order to interpret data to support decision-making
      prereq_matches: []
    - code: 2.1.3
      title: Développement Web
      title_en: Web Development
      heures: 56
      coefficient: 1
      prerequis: Aucun prérequis
      prerequis_en: No prerequisites
      objectifs:
      - À la fin de cet ECUE, les étudiants seront en mesure de comprendre les concepts de base du développement web et de créer des sites web simples pour répondre à des besoins avec du contexte entreprise.
      objectifs_en:
      - By the end of this ECUE, students will be able to understand the basic concepts of web development and create simple websites to meet needs in a business context.
      prereq_matches: []
  - code: '2.2'
    num: 2
    title: Concevoir la solution IA dans l’architecture globale
    title_en: Design the AI solution within the overall architecture
    ects: 4
    heures: 77
    themes: Ce programme complet de développement logiciel lie la Programmation Orientée Objet sous Python à l'algorithmique de graphes (Dijkstra, flux, arbres). Il impose une rigueur de conception via la modélisation UML (classes, séquences) et la validation par tests unitaires JUnit. L'objectif est de savoir structurer des données complexes (collections, I/O) pour résoudre des problèmes d'optimisation de réseaux et de maintenance logicielle.
    themes_en: This comprehensive software development programme links Object-Oriented Programming in Python to graph algorithmics (Dijkstra, flows, trees). It requires rigorous design through UML modelling (class and sequence diagrams) and validation through JUnit unit testing. The aim is to know how to structure complex data (collections, I/O) in order to solve network optimisation and software maintenance problems.
    competences:
    - Identifier les algos/protocoles pour une collecte efficace des données
    - Identifier la nécessité d'un prétraitement des données pour les intégrer dans la solution IA
    - Sélectionner les sources de données pour les modéliser et les cartographier
    - Identifier et exploiter les indicateurs de performance pour argumenter la solution retenue
    - Elaborer des tableaux de bord intégrant les données métier pour la prise de décision
    - Quantifier les besoins en capacité de calculs et de stockage des données
    - Identifier les ressources disponibles dans le SI
    - Appréhender les tenants et aboutissants de la solution IA
    - Définir les étapes d'un processus d'IA
    - Identifier les acteurs pour connaître l'ensemble des problématiques associées aux projets
    - Identifier les infrastructures IT nécessaires au sein de l'entreprise
    - Identifier et mettre en place des indicateurs de performance afin de choisir un modèle d'IA adapté
    - Manipuler des algorithmes sur plusieurs plateformes avec différents langages
    - Identifier et analyser les technologies appropriées pour aider à la prise de décisions
    - Mettre en œuvre la solution pour répondre aux besoins
    - Tester et valider la solution d'IA en s'appuyant sur les indicateurs de performance
    competences_en:
    - Identify the algorithms/protocols for effective data collection
    - Identify the need for data preprocessing in order to integrate it into the AI solution
    - Select data sources in order to model and map them
    - Identify and use performance indicators to justify the chosen solution
    - Develop dashboards incorporating business data for decision-making
    - Quantify data computing and storage capacity needs
    - Identify the resources available within the information system
    - Grasp the ins and outs of the AI solution
    - Define the steps of an AI process
    - Identify stakeholders in order to understand the full range of issues associated with the projects
    - Identify the IT infrastructure required within the company
    - Identify and set up performance indicators in order to choose a suitable AI model
    - Handle algorithms on several platforms using different languages
    - Identify and analyse the appropriate technologies to help with decision-making
    - Implement the solution to meet the needs
    - Test and validate the AI solution based on performance indicators
    ecues:
    - code: 2.2.1
      title: Programmation Orientée Objet avec Python
      title_en: Object-Oriented Programming with Python
      heures: 35
      coefficient: 1
      prerequis: Aucun prérequis
      prerequis_en: No prerequisites
      objectifs:
      - Comprendre les principes fondamentaux de la programmation orientée objet
      - Maîtriser l’utilisation des structures de données dynamiques, des collections avancées et des itérateurs/générateurs pour structurer et manipuler efficacement les données.
      - Appliquer les mécanismes de gestion des entrées/sorties et gérer les exceptions pour assurer la robustesse du programme.
      - Concevoir, lire et utiliser des diagrammes UML (classes et séquences) pour modéliser la structure et le comportement des systèmes orientés objet.
      - Développer des tests unitaires fiables pour garantir la qualité et la maintenabilité du code, tout en comprenant le fonctionnement du ramasse-miettes
      objectifs_en:
      - Understand the fundamental principles of object-oriented programming
      - Master the use of dynamic data structures, advanced collections and iterators/generators in order to structure and manipulate data efficiently.
      - Apply input/output management mechanisms and handle exceptions in order to ensure the robustness of the program.
      - Design, read and use UML diagrams (class and sequence diagrams) to model the structure and behaviour of object-oriented systems.
      - Develop reliable unit tests to ensure code quality and maintainability, while understanding how the garbage collector works
