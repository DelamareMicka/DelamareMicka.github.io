  - code: '4.1'
    num: 1
    title: Définir le besoin pour répondre à une problématique industrielle d’un projet Intelligence Artificielle
    title_en: Define the need to address an industrial issue in an Artificial Intelligence project
    ects: 4
    heures: 63
    themes: Cette UE vise à aborder l'optimisation combinatoire et la recherche opérationnelle appliquées aux problématiques industrielles d'intelligence artificielle. La modélisation mathématique des contraintes et objectifs industriels (logistique, planification, ressources). Les méthodes exactes vs approchées pour la résolution de problèmes NP-difficiles. L'intégration des solveurs d'optimisation dans les pipelines de décision automatique.
    themes_en: This UE addresses combinatorial optimisation and operations research applied to industrial artificial intelligence issues. It covers the mathematical modelling of industrial constraints and objectives (logistics, planning, resources); exact versus approximate methods for solving NP-hard problems; and the integration of optimisation solvers into automated decision pipelines.
    competences:
    - Construire les études d'opportunité en lien avec les acteurs métier (étude de cadrage, faisabilité, etc.)
    - Utiliser ses connaissances scientifiques pour vérifier et/ou identifier les causes d'un dysfonctionnement
    - Utiliser les statistiques pour optimiser la solution IA
    - Etablir un diagnostic afin de trouver les raisons d'un dysfonctionnement
    - Recenser les différentes solutions/technologies susceptibles de répondre au cahier des charges
    - Comparer les solutions existantes avec leur adéquation au besoin afin de participer aux choix techniques
    - Analyser et évaluer les risques (sécurité) d'une IA afin de participer à leur résolution
    - Rechercher des solutions techniques et réaliser une veille pour répondre à la problématique IA
    - Comparer les solutions qui répondent aux besoins afin de participer aux choix techniques
    - Construire et exposer tous les éléments permettant la prise de décision
    - S'approprier les différentes classes d'algorithmes (ML, DL,…) pour modéliser les données massives
    - Mettre en œuvre des méthodes de collecte, de stockage, de traitement et de visualisation des données
    - Appréhender les concepts d'architecture cloud (AWS, Azure,…) et les outils d'apprentissage (Keras, TF, etc.)
    - Conduire une veille technologique pour repérer les nouvelles applications et les évolutions
    competences_en:
    - Build opportunity studies in conjunction with business stakeholders (scoping study, feasibility, etc.)
    - Use scientific knowledge to verify and/or identify the causes of a malfunction
    - Use statistics to optimise the AI solution
    - Establish a diagnosis in order to find the reasons for a malfunction
    - Identify the various solutions/technologies likely to meet the specifications
    - Compare existing solutions with their suitability to the need in order to contribute to technical choices
    - Analyse and assess the risks (security) of an AI in order to help resolve them
    - Research technical solutions and carry out technology watch to address the AI problem
    - Compare solutions that meet the needs in order to contribute to technical choices
    - Build and present all the elements enabling decision-making
    - Master the different classes of algorithms (ML, DL, etc.) in order to model massive data
    - Implement methods for collecting, storing, processing and visualising data
    - Grasp cloud architecture concepts (AWS, Azure, etc.) and learning tools (Keras, TF, etc.)
    - Conduct technology watch in order to identify new applications and developments
    ecues:
    - code: 4.1.1
      title: Méta-Heuristiques et Algorithmes d'Optimisation
      title_en: Metaheuristics and Optimisation Algorithms
      heures: 42
      coefficient: 3
      prerequis: 'Algorithmique et structures de données

        Programmation Python (numpy, matplotlib)

        Mathématiques : analyse (dérivées, gradients), probabilités et statistiques descriptives

        Notions de complexité algorithmique (notation O)'
      prerequis_en: 'Algorithmics and data structures

        Python programming (numpy, matplotlib)

        Mathematics: analysis (derivatives, gradients), probability and descriptive statistics

        Notions of algorithmic complexity (O notation)'
      objectifs:
      - Comprendre la nature des problèmes d'optimisation combinatoire rencontrés dans les projets industriels
      - Maîtriser les concepts fondamentaux des méta-heuristiques (exploration vs exploitation, voisinage, paysage de fitness)
      - Être capable d'implémenter et paramétrer les principales méta-heuristiques (algorithmes évolutionnaires, méthodes de voisinage, recherche dispersée)
      - Savoir évaluer les performances et la robustesse d'une solution optimisée par rapport aux contraintes industrielles
      - Identifier les cas d'usage où les méta-heuristiques surpassent les méthodes exactes (grandes instances, temps réel)
      objectifs_en:
      - Understand the nature of the combinatorial optimisation problems encountered in industrial projects
      - Master the fundamental concepts of metaheuristics (exploration vs exploitation, neighbourhood, fitness landscape)
      - Be able to implement and configure the main metaheuristics (evolutionary algorithms, neighbourhood methods, scatter search)
      - Know how to evaluate the performance and robustness of an optimised solution against industrial constraints
      - Identify use cases where metaheuristics outperform exact methods (large instances, real time)
      prereq_matches:
      - 1.1.5
      - 1.2.1
      - 1.2.2
      - 1.2.3
      - 2.1.1
      - 2.1.2
      - 2.2.1
      - 2.2.2
      - 3.2.1
    - code: 4.1.2
      title: Programmation Linéaire en Nombres Entiers
      title_en: Integer Linear Programming
      heures: 21
      coefficient: 2
      prerequis: "Algèbre linéaire (matrices, vecteurs, résolution de systèmes) \nProgrammation Python (utilisation de bibliothèques)\nLogique propositionnelle et modélisation mathématique de base"
      prerequis_en: "Linear algebra (matrices, vectors, solving systems) \nPython programming (using libraries)\nPropositional logic and basic mathematical modelling"
      objectifs:
      - Formuler mathématiquement des problèmes industriels complexes sous forme de programmes linéaires en nombres entiers (PLNE)
      - Maîtriser la modélisation avec variables binaires, entières
      - Comprendre et appliquer les méthodes de résolution exacte (Branch and Bound, coupes, branch-and-cut)
      - Utiliser des solveurs industriels standards (CPLEX, Gurobi, ou alternatives open-source comme CBC, SCIP, OR-Tools)
      - Analyser la qualité des solutions (relaxation linéaire, gap d'optimalité) et interpréter les analyses de sensibilité
      - Intégrer la résolution PLNE dans une architecture décisionnelle d'entreprise
      objectifs_en:
      - Mathematically formulate complex industrial problems as integer linear programs (ILP)
      - Master modelling using binary and integer variables
      - Understand and apply exact resolution methods (Branch and Bound, cutting planes, branch-and-cut)
      - Use standard industrial solvers (CPLEX, Gurobi, or open-source alternatives such as CBC, SCIP, OR-Tools)
      - Analyse the quality of solutions (linear relaxation, optimality gap) and interpret sensitivity analyses
      - Integrate ILP resolution into a company's decision-making architecture
      prereq_matches:
      - 1.1.3
      - 1.2.1
      - 1.2.3
      - 2.2.1
  - code: '4.2'
    num: 2
    title: Concevoir la solution IA dans l’architecture globale
    title_en: Design the AI solution within the overall architecture
    ects: 2
    heures: 35
    themes: Ce module explore l'évolution technique et l'architecture des LLM, de leur conception aux stratégies de prompting, tout en analysant leurs applications concrètes. Il intègre une dimension critique sur l'éthique, les biais et l'impact environnemental de l'IA générative. Réalisation d'un projet pratique incluant la sélection de modèles, l'optimisation des prompts et l'évaluation des résultats.
    themes_en: This module explores the technical evolution and architecture of LLMs, from their design to prompting strategies, while analysing their concrete applications. It incorporates a critical perspective on the ethics, biases and environmental impact of generative AI. Students carry out a practical project involving model selection, prompt optimisation and results evaluation.
    competences:
    - Identifier les différentes sources de données
    - Identifier les algos/protocoles pour une collecte efficace des données
    - Identifier la nécessité d'un prétraitement des données pour les intégrer dans la solution IA
    - Sélectionner les sources de données pour les modéliser et les cartographier
    - Identifier et exploiter les indicateurs de performance pour argumenter la solution retenue
    - Elaborer des tableaux de bord intégrant les données métier pour la prise de décision
    - Quantifier les besoins en capacité de calculs et de stockage des données
    - Identifier les ressources disponibles dans le SI
    - Appréhender les tenants et aboutissants de la solution IA
    - Définir les étapes d'un processus d'IA
    - Identifier les acteurs pour connaître l'ensemble des problématiques associées aux projets
    - Identifier les infrastructures IT nécessaires au sein de l'entreprise
    - Identifier et mettre en place des indicateurs de performance afin de choisir un modèle d'IA adapté
    - Manipuler des algorithmes sur plusieurs plateformes avec différents langages
    - Identifier et analyser les technologies appropriées pour aider à la prise de décisions
    - Mettre en œuvre la solution pour répondre aux besoins
    - Tester et valider la solution d'IA en s'appuyant sur les indicateurs de performance
    competences_en:
    - Identify the various data sources
    - Identify the algorithms/protocols for effective data collection
    - Identify the need for data preprocessing in order to integrate it into the AI solution
    - Select data sources in order to model and map them
    - Identify and use performance indicators to justify the chosen solution
    - Develop dashboards incorporating business data for decision-making
    - Quantify data computing and storage capacity needs
    - Identify the resources available within the information system
    - Grasp the ins and outs of the AI solution
    - Define the steps of an AI process
    - Identify stakeholders in order to understand the full range of issues associated with the projects
    - Identify the IT infrastructure required within the company
    - Identify and set up performance indicators in order to choose a suitable AI model
    - Handle algorithms on several platforms using different languages
    - Identify and analyse the appropriate technologies to help with decision-making
    - Implement the solution to meet the needs
    - Test and validate the AI solution based on performance indicators
    ecues:
    - code: 4.2.1
      title: Fonctionnement de l’IA Générative et Prompting
      title_en: How Generative AI Works, and Prompting
      heures: 35
      coefficient: 1
      prerequis: Bonne compréhension de la programmation, en particulier en Python, des bases en apprentissage automatique (machine learning), des connaissances en statistiques et algèbre linéaire, une introduction au traitement du langage naturel (NLP), ainsi que des notions de base en informatique et réseaux.
      prerequis_en: A good understanding of programming, particularly in Python, basics in machine learning, knowledge of statistics and linear algebra, an introduction to natural language processing (NLP), as well as basic notions of computing and networks.
      objectifs:
      - Fournir aux étudiants une compréhension approfondie des modèles de langage de grande taille (LLM), de leur historique, de leurs applications, de leur architecture, ainsi que des défis éthiques et pratiques associés à leur utilisation.
      objectifs_en:
      - Provide students with an in-depth understanding of large language models (LLMs), their history, their applications, their architecture, and the ethical and practical challenges associated with their use.
      prereq_matches:
      - 1.1.3
      - 1.2.1
      - 1.2.3
      - 2.1.2
      - 2.2.1
      - 4.1.2
  - code: '4.3'
    num: 3
    title: Développer et maintenir une solution d’IA pour optimiser les performances de l’entreprise en respectant une démarche éthique et écologique
    title_en: Develop and maintain an AI solution to optimise company performance while respecting an ethical and ecological approach
    ects: 4
    heures: 63
    themes: Cette thématique porte sur la conception de modèles de machine learning performants, articulant les approches supervisées (régression) et non supervisées (clustering) pour répondre à des problématiques métiers. Elle impose l'intégration systématique de la sobriété numérique et de la lutte contre les biais algorithmiques pour garantir des solutions d'IA éthiques et écoresponsables.
    themes_en: This topic covers the design of high-performing machine learning models, combining supervised (regression) and unsupervised (clustering) approaches to address business problems. It requires the systematic integration of digital sobriety and the fight against algorithmic bias in order to guarantee ethical and eco-responsible AI solutions.
    competences:
    - Implémenter une solution IA dans un SI existant avec des technologies et/ou langages appropriés
    - Assurer la configuration de la solution d'IA déployée
    - Mesurer et réduire les impacts environnementaux de la solution IA au regard des instances réglementaires
    - Sélectionner et formaliser les éléments de performances de la solution pour effectuer un reporting
    - Suivre la solution d'IA au sein du SI, garantir son efficacité et ses évolutions
    - Maintenir le système IA mis en place pour garantir la continuité de service
    - Paramétrer des solutions IA et maîtriser les métriques associées pour valider les performances
    - Utiliser des scripts Python s'appuyant sur des bibliothèques dédiées IA pour maintenir la solution déployée
    - Analyser les résultats de la solution IA afin d'en évaluer l'impact écologique
    - Mettre en place des solutions correctives si les résultats ne sont pas optimaux
    competences_en:
    - Implement an AI solution in an existing information system using appropriate technologies and/or languages
    - Ensure the configuration of the deployed AI solution
    - Measure and reduce the environmental impacts of the AI solution with regard to regulatory bodies
    - Select and formalise the solution's performance elements in order to produce reporting
    - Monitor the AI solution within the information system, ensuring its effectiveness and its evolution
    - Maintain the AI system in place to guarantee continuity of service
    - Configure AI solutions and master the associated metrics to validate performance
    - Use Python scripts based on dedicated AI libraries to maintain the deployed solution
    - Analyse the results of the AI solution in order to assess its ecological impact
    - Implement corrective solutions if the results are not optimal
    ecues:
    - code: 4.3.1
      title: Apprentissage Supervisé
      title_en: Supervised Learning
      heures: 19
      coefficient: 1
      prerequis: "Bases de programmation Python (pandas, numpy) ; \nNotions fondamentales de statistiques (moyenne, variance, distribution) ; manipulation de données tabulaires.\nPas de prérequis mathématiques avancés."
      prerequis_en: "Basics of Python programming (pandas, numpy); \nFundamental notions of statistics (mean, variance, distribution); handling of tabular data.\nNo advanced mathematical prerequisites."
      objectifs:
      - Cet ECUE introduit les concepts fondamentaux de l’apprentissage supervisé. Les étudiants découvrent les notions de jeu d’entraînement/test, de sur-apprentissage et de généralisation. Ils étudient les principaux algorithmes (arbres de décision, forêts aléatoires, SVM, k-NN) et apprennent à évaluer leurs performances via des métriques clés (précision, rappel, F1-score, AUC). L’intégration d’une approche éthique (détection de biais) et écologique (sobriété des modèles) est abordée tout au long du cours.
      objectifs_en:
      - This ECUE introduces the fundamental concepts of supervised learning. Students discover the notions of training/test sets, overfitting and generalisation. They study the main algorithms (decision trees, random forests, SVM, k-NN) and learn to evaluate their performance using key metrics (precision, recall, F1-score, AUC). The integration of an ethical approach (bias detection) and an ecological approach (model sobriety) is addressed throughout the course.
      prereq_matches:
      - 1.2.1
      - 1.2.3
      - 2.1.2
      - 2.2.1
      - 4.1.2
    - code: 4.3.2
      title: Modèles de Régression
      title_en: Regression Models
      heures: 19
      coefficient: 1
      prerequis: L’ECUE 4.3.1 validé ; maîtrise des opérations matricielles et algèbre linéaire élémentaire ; statistiques descriptives et inférentielles ; utilisation de scikit-learn pour l’entraînement de modèles simples.
      prerequis_en: ECUE 4.3.1 passed; mastery of matrix operations and elementary linear algebra; descriptive and inferential statistics; use of scikit-learn for training simple models.
      objectifs:
      - Cet ECUE approfondit la modélisation prédictive quantitative à travers les techniques de régression. Les étudiants maîtrisent la régression linéaire simple et multiple, la régression logistique, ainsi que les méthodes de régularisation (Ridge, Lasso, ElasticNet).
      - Ils apprennent à diagnostiquer la qualité d’un modèle (R², RMSE, résidus), à détecter le sur-apprentissage et à optimiser les hyperparamètres. La construction responsable des modèles — en termes d’équité et de minimisation de l’empreinte computationnelle — est intégrée aux travaux pratiques.
      objectifs_en:
      - This ECUE explores quantitative predictive modelling in depth through regression techniques. Students master simple and multiple linear regression, logistic regression, as well as regularisation methods (Ridge, Lasso, ElasticNet).
      - They learn to diagnose the quality of a model (R², RMSE, residuals), to detect overfitting and to optimise hyperparameters. The responsible construction of models — in terms of fairness and minimising computational footprint — is incorporated into the practical work.
      prereq_matches:
      - 1.1.3
      - 2.1.2
    - code: 4.3.3
      title: Clustering Automatique et Fonctions Pertes
      title_en: Automatic Clustering and Loss Functions
      heures: 18
      coefficient: 1
      prerequis: "Les ECUEs « Apprentissage Supervisé » et « Modèles de Régression » finalisés\nNotions de géométrie vectorielle et distances ;\nCalcul différentiel élémentaire (dérivées, gradient) ; \nMaîtrise de matplotlib/seaborn pour la visualisation multidimensionnelle."
      prerequis_en: "The ECUEs \"Supervised Learning\" and \"Regression Models\" completed\nNotions of vector geometry and distances;\nElementary differential calculus (derivatives, gradient); \nMastery of matplotlib/seaborn for multidimensional visualisation."
      objectifs:
      - Cet ECUE aborde l’apprentissage non supervisé à travers les techniques de clustering et approfondit le rôle crucial des fonctions de perte dans l’entraînement des modèles. Les étudiants maîtrisent les algorithmes K-Means, DBSCAN et la classification hiérarchique (CAH), ainsi que la réduction dimensionnelle (ACP, t-SNE). Ils comprennent les fonctions de perte (MSE, Cross-Entropy, Hinge) et leur rôle dans l’optimisation par descente de gradient. L’ECUE intègre une réflexion sur l’interprétabilité, l’équité des groupes formés et l’efficience computationnelle.
      objectifs_en:
      - This ECUE covers unsupervised learning through clustering techniques and explores in depth the crucial role of loss functions in model training. Students master the K-Means and DBSCAN algorithms and hierarchical clustering (HCA), as well as dimensionality reduction (PCA, t-SNE). They understand loss functions (MSE, Cross-Entropy, Hinge) and their role in gradient-descent optimisation. The ECUE incorporates a discussion of interpretability, the fairness of the resulting groups, and computational efficiency.
      prereq_matches:
      - 4.3.1
      - 4.3.2
    - code: 4.3.4
      title: Ethique numérique et écologique
      title_en: Digital and Ecological Ethics
      heures: 7
      coefficient: 1
      prerequis: Aucun
      prerequis_en: None
      objectifs:
      - Les étudiants devront comprendre les impacts numériques et éthiques sur l'écologie afin de les prendre en compte dans l'implémentation de leur solution.
      objectifs_en:
      - Students must understand the digital and ethical impacts on ecology in order to take them into account when implementing their solution.
      prereq_matches: []
  - code: '4.4'
    num: 4
    title: Organiser et piloter un projet d’intelligence artificielle et accompagner le changement numérique
    title_en: Organise and manage an artificial intelligence project and support digital change
    ects: 4
    heures: 56
    themes: Cette UE porte sur la réalisation opérationnelle d'une solution d'IA performante en intégrant les impératifs de la Responsabilité Sociétale des Entreprises (RSE) et des normes ISO 26000 et IEC 27001. Elle exige de savoir défendre une démarche technique tout en garantissant la sécurité des informations et la résolution éthique des problématiques liées au droit du travail.
    themes_en: This UE covers the operational delivery of a high-performing AI solution while integrating the requirements of Corporate Social Responsibility (CSR) and the ISO 26000 and IEC 27001 standards. It requires the ability to defend a technical approach while guaranteeing information security and the ethical resolution of labour-law-related issues.
    competences:
    - S'adapter aux méthodes de gestion de projet de type AGILE, PMI, etc. pour l'appliquer aux projets IA
    - Former les utilisateurs et/ou les mainteneurs de la solution IA pour garantir le transfert des connaissances
    - Identifier les sous-projets et tâches inclus dans le projet global pour en estimer les durées
    - Planifier les projets IA en utilisant PERT et GANTT pour construire le planning détaillé
    - Définir les principaux jalons du projet (points de validation) pour vérifier le bon déroulement
    - Concevoir le planning du projet à travers un outil de représentation graphique
    - Identifier les risques inhérents au projet IA afin d'en évaluer la criticité
    - Définir un plan de réponses aux risques identifiés et élaborer un tableau de suivi
    - Accompagner le changement numérique
    - Favoriser l'appropriation des outils numériques par les collaborateurs
    - Prendre en compte l'impact environnemental des projets afin de réduire l'empreinte carbone
    - Conduire les réunions de suivi de projet en IA
    - Actualiser les données des tableaux de bord (coûts, réalisé, risques, etc.) pour réguler les aléas
    - Organiser et mener les réunions et échanges pour garantir le bon déroulement du projet
    - Synthétiser et formaliser les documents de reporting à destination du comité de pilotage
    - Etablir la documentation technique des projets IA et transmettre les documents aux parties prenantes
    - Assurer le transfert de compétences auprès des administrateurs pour garantir la viabilité de la solution
    - Organiser et animer la capitalisation de l'expérience à l'issue du projet IA
    competences_en:
    - Adapt to project management methods such as AGILE, PMI, etc. in order to apply them to AI projects
    - Train the users and/or maintainers of the AI solution to ensure knowledge transfer
    - Identify the sub-projects and tasks included in the overall project in order to estimate their durations
    - Plan AI projects using PERT and GANTT charts to build the detailed schedule
    - Define the project's main milestones (validation points) to check that it is proceeding correctly
    - Design the project schedule using a graphical representation tool
    - Identify the risks inherent in the AI project in order to assess their criticality
    - Define a response plan for the identified risks and draw up a monitoring table
    - Support digital change
    - Encourage employees to take ownership of digital tools
    - Take into account the environmental impact of projects in order to reduce the carbon footprint
    - Lead AI project follow-up meetings
    - Update dashboard data (costs, actuals, risks, etc.) to manage contingencies
    - Organise and lead meetings and discussions to ensure the project runs smoothly
    - Summarise and formalise reporting documents for the steering committee
    - Produce technical documentation for AI projects and pass the documents on to stakeholders
    - Ensure skills transfer to administrators to guarantee the viability of the solution
    - Organise and facilitate the capitalisation of experience at the end of the AI project
    ecues:
    - code: 4.4.1
      title: Projet intelligence Artificielle
      title_en: Artificial Intelligence Project
      heures: 35
      coefficient: 1
      prerequis: ''
      prerequis_en: ''
      objectifs:
      - Dans cette ECUE les étudiants seront amenés à réaliser un projet de développement en mettant en œuvre les outils de pilotage (de la demande client à la réalisation du projet)
      objectifs_en:
      - In this ECUE, students will carry out a development project using project management tools (from the client request through to project delivery)
      prereq_matches: []
    - code: 4.4.2
      title: RSE/Droit du Travail Spécifique à l'IA et Normes de Sécurité ISO et IEC27001
      title_en: CSR/Labour Law Specific to AI, and ISO and IEC 27001 Security Standards
      heures: 21
      coefficient: 1
      prerequis: 'Connaissances de base en informatique et en IA

        Capacité d’analyse et de réflexion critique, compétences en communication et travail d’équipe

        Curiosités, ouverture d’esprit, sensibilité aux questions éthiques et la responsabilité sociale'
      prerequis_en: 'Basic knowledge of computing and AI

        Analytical and critical thinking skills, communication and teamwork skills

        Curiosity, open-mindedness, and sensitivity to ethical issues and social responsibility'
      objectifs:
      - Les étudiants devront comprendre les impacts numériques et éthiques de l’Intelligence Artificielle sur l’environnement afin de les prendre en compte dans l'implémentation de leur solution.
      - Comprendre les concepts fondamentaux de la RSE et des normes ISO 26000 et IEC 27001 dans le contexte de l'Intelligence Artificielle.
      - Décrire les principes et domaines centraux de l'ISO 26000 appliqués à l'IA.
      - Expliquer la mise en œuvre de la norme IEC 27001 pour sécuriser les systèmes d'IA.
      - Analyser des études de cas sur la RSE et l'IA.
      - Évaluer les plans de gestion des risques pour la sécurité de l'information dans les projets d'IA.
      - Créer un projet intégratif de RSE pour une organisation fictive utilisant l'IA
      objectifs_en:
      - Students must understand the digital and ethical impacts of Artificial Intelligence on the environment in order to take them into account when implementing their solution.
      - Understand the fundamental concepts of CSR and the ISO 26000 and IEC 27001 standards in the context of Artificial Intelligence.
      - Describe the principles and core subjects of ISO 26000 as applied to AI.
      - Explain the implementation of the IEC 27001 standard to secure AI systems.
      - Analyse case studies on CSR and AI.
      - Evaluate information-security risk management plans in AI projects.
      - Create an integrative CSR project for a fictitious organisation using AI
      prereq_matches: []
  - code: '4.5'
    num: 5
    title: Anglais
    title_en: English
    ects: 2
    heures: 28
    themes: 'Anglais à coloration professionnelle et technique

      Sujets de réflexion sur des problèmes liés à l’interculturalité

      Mobilité internationale'
    themes_en: 'Professional and technical English

      Discussion topics on issues related to interculturality

      International mobility'
    competences:
    - Consolider le niveau B1
    - Peut comprendre les points essentiels quand un langage clair et standard est utilisé et s'il s'agit de choses familières dans le travail, à l'école, dans les loisirs, etc.
    - Peut se débrouiller dans la plupart des situations rencontrées en voyage dans une région où la langue cible est parlée.
    - Peut produire un discours simple et cohérent sur des sujets familiers et dans ses domaines d'intérêt.
    - Peut raconter un événement, une expérience ou un rêve, décrire un espoir ou un but et exposer brièvement des raisons ou explications pour un projet ou une idée.
    competences_en:
    - Consolidate B1 level
    - Can understand the main points of clear standard input on familiar matters regularly encountered in work, school, leisure, etc.
    - Can deal with most situations likely to arise while travelling in an area where the target language is spoken.
    - Can produce simple connected text on topics that are familiar or of personal interest.
    - Can narrate an event, an experience or a dream, describe a hope or goal, and briefly give reasons or explanations for a plan or an idea.
    ecues:
    - code: 4.5.1
      title: Anglais Semestre 4
