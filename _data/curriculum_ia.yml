  - code: '6.2'
    num: 2
    title: Concevoir la solution IA dans l’architecture globale
    title_en: Design the AI solution within the overall architecture
    ects: 3
    heures: 63
    themes: Cette unité d'enseignement combine l'architecture et l'administration des réseaux locaux (modèles OSI/TCP-IP, adressage IPv4/v6, configuration Cisco et Active Directory) avec les outils mathématiques du traitement de signal (Transformée de Fourier, filtrage, échantillonnage). Elle traite également de la théorie de l'information appliquée à l'image, incluant les mécanismes de compression avec et sans perte (Huffman, DCT, standard JPEG). L'ensemble vise à maîtriser la chaîne complète de transmission, du traitement des données jusqu'à leur acheminement réseau.
    themes_en: This teaching unit combines local network architecture and administration (OSI/TCP-IP models, IPv4/v6 addressing, Cisco and Active Directory configuration) with the mathematical tools of signal processing (Fourier transform, filtering, sampling). It also covers information theory applied to images, including lossy and lossless compression mechanisms (Huffman, DCT, the JPEG standard). Together, these aim to master the complete transmission chain, from data processing through to its routing across the network.
    competences:
    - Identifier les différentes sources de données
    - Identifier les algos/protocoles pour une collecte efficace des données
    - Identifier la nécessité d'un prétraitement des données pour les intégrer dans la solution IA
    - Sélectionner les sources de données pour les modéliser et les cartographier
    - Identifier et exploiter les indicateurs de performance pour argumenter la solution retenue
    - Elaborer des tableaux de bord intégrant les données métier pour la prise de décision
    - Quantifier les besoins en capacité de calculs et de stockage des données
    - Identifier les ressources disponibles dans le SI
    - Appréhender les tenants et aboutissants de la solution IA
    - Définir les étapes d'un processus d'IA
    - Identifier les acteurs pour connaître l'ensemble des problématiques associées aux projets
    - Identifier les infrastructures IT nécessaires au sein de l'entreprise
    - Identifier et mettre en place des indicateurs de performance afin de choisir un modèle d'IA adapté
    - Manipuler des algorithmes sur plusieurs plateformes avec différents langages
    - Identifier et analyser les technologies appropriées pour aider à la prise de décisions
    - Mettre en œuvre la solution pour répondre aux besoins
    competences_en:
    - Identify the various data sources
    - Identify the algorithms/protocols for effective data collection
    - Identify the need for data preprocessing in order to integrate it into the AI solution
    - Select data sources in order to model and map them
    - Identify and use performance indicators to justify the chosen solution
    - Develop dashboards incorporating business data for decision-making
    - Quantify data computing and storage capacity needs
    - Identify the resources available within the information system
    - Grasp the ins and outs of the AI solution
    - Define the steps of an AI process
    - Identify stakeholders in order to understand the full range of issues associated with the projects
    - Identify the IT infrastructure required within the company
    - Identify and set up performance indicators in order to choose a suitable AI model
    - Handle algorithms on several platforms using different languages
    - Identify and analyse the appropriate technologies to help with decision-making
    - Implement the solution to meet the needs
