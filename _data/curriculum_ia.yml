- number: 3
  ues:
  - code: '3.1'
    num: 1
    title: Définir le besoin pour répondre à une problématique industrielle d’un projet Intelligence Artificielle
    title_en: Define the need to address an industrial issue in an Artificial Intelligence project
    ects: 10
    heures: 112
    themes: Cette UE vise à donner aux étudiants les fondements mathématiques et neuro-computationnels nécessaires pour analyser et formaliser une problématique industrielle en intelligence artificielle. Elle articule algèbre linéaire, réduction de dimension (ACP, SVD) et principes de la communication neuronale afin de comprendre comment structurer, transformer et interpréter des données dans un contexte métier. L’ensemble permet de passer d’un besoin industriel exprimé à une modélisation rigoureuse et techniquement exploitable dans un projet IA.
    themes_en: This UE aims to give students the mathematical and neuro-computational foundations needed to analyse and formalise an industrial issue in artificial intelligence. It combines linear algebra, dimensionality reduction (PCA, SVD) and the principles of neuronal communication in order to understand how to structure, transform and interpret data in a business context. Together, these enable students to move from an expressed industrial need to a rigorous model that can be put to technical use in an AI project.
    competences:
    - Utiliser ses connaissances scientifiques pour vérifier et/ou identifier les causes d'un dysfonctionnement
    - Utiliser les statistiques pour optimiser la solution IA
    - Etablir un diagnostic afin de trouver les raisons d'un dysfonctionnement
    - Recenser les différentes solutions/technologies susceptibles de répondre au cahier des charges
    - Comparer les solutions existantes avec leur adéquation au besoin afin de participer aux choix techniques
    - Analyser et évaluer les risques (sécurité) d'une IA afin de participer à leur résolution
    - Rechercher des solutions techniques et réaliser une veille pour répondre à la problématique IA
    - Comparer les solutions qui répondent aux besoins afin de participer aux choix techniques
    - Construire et exposer tous les éléments permettant la prise de décision
    - S'approprier les différentes classes d'algorithmes (ML, DL,…) pour modéliser les données massives
    - Mettre en œuvre des méthodes de collecte, de stockage, de traitement et de visualisation des données
    competences_en:
    - Use scientific knowledge to verify and/or identify the causes of a malfunction
    - Use statistics to optimise the AI solution
    - Establish a diagnosis in order to find the reasons for a malfunction
    - Identify the various solutions/technologies likely to meet the specifications
    - Compare existing solutions with their suitability to the need in order to contribute to technical choices
    - Analyse and assess the risks (security) of an AI in order to help resolve them
    - Research technical solutions and carry out technology watch to address the AI problem
    - Compare solutions that meet the needs in order to contribute to technical choices
    - Build and present all the elements enabling decision-making
    - Master the different classes of algorithms (ML, DL, etc.) in order to model massive data
    - Implement methods for collecting, storing, processing and visualising data
    ecues:
    - code: 3.1.1
      title: Propriétés Algébriques des Endomorphismes
      title_en: Algebraic Properties of Endomorphisms
      heures: 42
      coefficient: 1
      prerequis: 'Maîtrise des bases de l’algèbre linéaire (vecteurs, matrices, systèmes linéaires)

        Calcul matriciel élémentaire

        Résolution de systèmes d’équations'
      prerequis_en: 'Mastery of the basics of linear algebra (vectors, matrices, linear systems)

        Elementary matrix calculus

        Solving systems of equations'
      objectifs:
      - Modéliser une transformation à l’aide d’une application linéaire.
      - Calculer noyau, image et rang d’un endomorphisme.
      - Déterminer valeurs propres et vecteurs propres d’une matrice.
      - Vérifier la diagonalisabilité d’un opérateur.
      - Interpréter une décomposition spectrale dans un contexte de traitement de données.
      objectifs_en:
      - Model a transformation using a linear map.
      - Compute the kernel, image and rank of an endomorphism.
      - Determine the eigenvalues and eigenvectors of a matrix.
      - Check whether an operator is diagonalisable.
      - Interpret a spectral decomposition in a data-processing context.
      prereq_matches:
      - 1.1.3
    - code: 3.1.2
      title: Analyse en composentes principales et décompositions en valeurs singulières
      title_en: Principal Component Analysis and Singular Value Decomposition
      heures: 35
      coefficient: 1
      prerequis: 'Maîtrise des notions d’algèbre linéaire (valeurs propres, matrices)

        Bases en statistiques descriptives

        Notions élémentaires de programmation Python'
      prerequis_en: 'Mastery of linear algebra notions (eigenvalues, matrices)

        Basics of descriptive statistics

        Elementary notions of Python programming'
      objectifs:
      - Préparer un jeu de données pour analyse multivariée.
      - Construire et interpréter une matrice de covariance.
      - Mettre en œuvre une ACP.
      - Appliquer une décomposition en valeurs singulières.
      - Justifier le choix du nombre de composantes retenues.
      - Identifier les limites et biais d’une réduction de dimension.
      objectifs_en:
      - Prepare a dataset for multivariate analysis.
      - Build and interpret a covariance matrix.
      - Implement PCA (Principal Component Analysis).
      - Apply a singular value decomposition.
      - Justify the choice of the number of components retained.
      - Identify the limitations and biases of a dimensionality reduction.
      prereq_matches:
      - 1.1.3
      - 1.2.1
      - 1.2.3
      - 2.1.2
      - 2.2.1
    - code: 3.1.3
      title: Communication Neuronale
      title_en: Neuronal Communication
      heures: 35
      coefficient: 1
      prerequis: 'Notions de biologie générale (niveau lycée)

        Bases de modélisation mathématique simples

        Intérêt pour les systèmes dynamiques'
      prerequis_en: 'Notions of general biology (high-school level)

        Basics of simple mathematical modelling

        Interest in dynamical systems'
      objectifs:
      - Décrire l’organisation fonctionnelle du neurone biologique.
      - Expliquer les mécanismes du potentiel d’action.
      - Décrire la transmission synaptique.
      - Comparer neurone biologique et neurone artificiel.
      - Simuler un modèle simplifié de neurone.
      - Identifier les limites de l’analogie cerveau / IA.
      objectifs_en:
      - Describe the functional organisation of the biological neuron.
      - Explain the mechanisms of the action potential.
      - Describe synaptic transmission.
      - Compare the biological neuron with the artificial neuron.
      - Simulate a simplified neuron model.
      - Identify the limits of the brain/AI analogy.
      prereq_matches: []
  - code: '3.2'
    num: 2
    title: Concevoir la solution IA dans l’architecture globale
    title_en: Design the AI solution within the overall architecture
    ects: 8
    heures: 84
    themes: Cette thématique porte sur l'optimisation algorithmique et l'analyse de données non supervisée, en articulant l'implémentation de structures de données complexes (graphes, arbres) avec les méthodes de partitionnement (K-means, DBSCAN). Elle vise à évaluer la performance des systèmes via la complexité Big O et la précision des calculs de similarité pour le traitement de l'information.
    themes_en: This topic covers algorithmic optimisation and unsupervised data analysis, combining the implementation of complex data structures (graphs, trees) with clustering methods (K-means, DBSCAN). It aims to assess system performance through Big O complexity and the precision of similarity calculations for information processing.
    competences:
    - Identifier les algos/protocoles pour une collecte efficace des données
