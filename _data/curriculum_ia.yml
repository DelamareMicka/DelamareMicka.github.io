    title_en: Organise and manage an artificial intelligence project and support digital change
    ects: 6
    heures: 63
    themes: Cette thématique porte sur le pilotage opérationnel et la sécurisation du cycle de vie logiciel, en conciliant les méthodes agiles (Scrum) et traditionnelles (MOA/MOE) avec les impératifs de qualité technique. Elle intègre la conduite du changement, la rigueur des phases de test et de recette, ainsi que l'optimisation durable du code source sous le prisme de la cybersécurité.
    themes_en: This topic covers operational management and securing the software life cycle, reconciling agile methods (Scrum) with traditional ones (client/contracting-authority and project-management roles) alongside technical quality requirements. It incorporates change management, the rigour of testing and acceptance phases, and the sustainable optimisation of source code through the lens of cybersecurity.
