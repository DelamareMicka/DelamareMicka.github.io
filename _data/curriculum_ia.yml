- number: 6
  ues:
  - code: '6.1'
    num: 1
    title: Définir le besoin pour répondre à une problématique industrielle d’un projet Intelligence Artificielle
    title_en: Define the need to address an industrial issue in an Artificial Intelligence project
    ects: 2
    heures: 42
    themes: L’UE aborde les fondements de l’innovation et de l’entrepreneuriat en entreprise. Elle traite des différences entre créativité et innovation, des typologies d’innovations et des méthodes permettant de générer, structurer et développer des idées nouvelles. L’UE explore également les processus d’innovation et les outils mobilisables pour accompagner la création de valeur. Elle introduit ensuite les bases de l’entrepreneuriat, la posture entrepreneuriale, les étapes du processus entrepreneurial et les structures d’accompagnement. L’ensemble permet aux étudiants de comprendre comment émergent les idées innovantes, comment elles se transforment en projets, et comment elles peuvent être portées dans un cadre entrepreneurial.
    themes_en: This UE covers the fundamentals of innovation and entrepreneurship within a company. It addresses the differences between creativity and innovation, the typologies of innovation, and the methods for generating, structuring and developing new ideas. The UE also explores innovation processes and the tools that can be used to support value creation. It then introduces the basics of entrepreneurship, the entrepreneurial mindset, the stages of the entrepreneurial process, and support structures. Together, these enable students to understand how innovative ideas emerge, how they turn into projects, and how they can be carried forward within an entrepreneurial framework.
    competences:
    - Analyser le besoin du client, le contexte économique, l'environnement, la technicité et les métiers de l'entreprise afin d'appréhender le périmètre du projet
    - Identifier et analyser les flux d'information et les processus et activités de l'entreprise afin de comprendre le schéma d'organisation métier
    - Construire les études d'opportunité en lien avec les acteurs métier (étude de cadrage, faisabilité, etc.)
    - Elaborer une note de cadrage (ou charte projet) pour définir le périmètre global du projet
    - Recenser les différentes solutions/technologies susceptibles de répondre au cahier des charges
    - Comparer les solutions existantes avec leur adéquation au besoin afin de participer aux choix techniques
    - Rechercher des solutions techniques et réaliser une veille pour répondre à la problématique IA
    - Comparer les solutions qui répondent aux besoins afin de participer aux choix techniques
    - Construire et exposer tous les éléments permettant la prise de décision
    - Rechercher et contacter les structures d'accompagnement à l'entrepreneuriat
    - Conduire une veille technologique pour repérer les nouvelles applications et les évolutions
    competences_en:
    - Analyse the client's need, the economic context, the environment, the technical aspects and the business lines of the company in order to grasp the scope of the project
    - Identify and analyse information flows and the company's processes and activities in order to understand the business organisation model
    - Build opportunity studies in conjunction with business stakeholders (scoping study, feasibility, etc.)
    - Draft a scoping note (or project charter) to define the overall scope of the project
    - Identify the various solutions/technologies likely to meet the specifications
    - Compare existing solutions with their suitability to the need in order to contribute to technical choices
    - Research technical solutions and carry out technology watch to address the AI problem
    - Compare solutions that meet the needs in order to contribute to technical choices
    - Build and present all the elements enabling decision-making
    - Research and contact entrepreneurship support organisations
    - Conduct technology watch in order to identify new applications and developments
    ecues:
