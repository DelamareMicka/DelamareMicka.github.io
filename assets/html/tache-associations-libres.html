<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographie mentale — associations libres</title>
<style>
  /* ============================================================
     ZONE À MODIFIER PAR L'ENSEIGNANT → voir le <script> tout en bas
     (liste des concepts, nombre d'associations)
     Le reste ne demande aucune configuration.
     ============================================================ */
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1e2430; --dim:#69748a;
    --line:#e4e8ef; --accent:#3b6ea5; --accent-soft:#3b6ea515;
    --sel:#eef3f9; --sel-br:#3b6ea5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;}
  .app{max-width:640px;margin:0 auto;padding:26px 18px 60px;min-height:100vh;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px 24px;box-shadow:0 8px 30px -22px #000;}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em;}
  h2{font-size:26px;margin:0;letter-spacing:-.01em;}
  p{margin:0 0 14px;color:var(--dim);font-size:15px;}
  label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px;font-weight:600;}
  input[type=text]{width:100%;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);outline:none;}
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .btn{appearance:none;border:0;cursor:pointer;font-size:16px;font-weight:600;
    padding:14px 22px;border-radius:11px;background:var(--accent);color:#fff;
    transition:filter .15s;}
  .btn:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .row{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap;}
  .spacer{flex:1;}

  .progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 22px;}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:99px;
    transition:width .3s ease;}
  .step-lbl{font-size:12.5px;color:var(--dim);margin:0 0 8px;letter-spacing:.02em;}

  .cue{font-size:15px;color:var(--dim);margin-bottom:2px;}
  .cueword{font-size:30px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em;}
  .hint{font-size:13.5px;color:var(--dim);margin-bottom:16px;}

  .valence{display:flex;gap:10px;margin-top:6px;}
  .valence button{flex:1;padding:13px 8px;border-radius:11px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);font-size:15px;cursor:pointer;font-weight:600;}
  .valence button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-br);
    box-shadow:0 0 0 3px var(--accent-soft);}

  .done-emoji{font-size:34px;}
  .small{font-size:13px;color:var(--dim);margin-top:18px;}
  .kbd{font-family:ui-monospace,monospace;background:#eef1f5;border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;font-size:12.5px;}
  @media (max-width:420px){ .valence{flex-direction:column;} }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   ▼▼▼  CONFIGURATION ENSEIGNANT — MODIFIE SEULEMENT CES LIGNES  ▼▼▼
   ============================================================ */

// 1) Les concepts inducteurs de ton module (ceux que l'étudiant verra).
//    Remplace la liste d'exemple par la tienne.
const CONCEPTS = [
  "neurone",
  "couche cachée",
  "poids",
  "fonction d'activation",
  "fonction de coût",
  "descente de gradient",
  "rétropropagation",
  "donnée d'entraînement",
  "classification",
  "profondeur"
];

// 2) Nombre maximal d'associations demandées par concept (3 = standard).
const NB_ASSOCIATIONS = 3;

// 3) Faut-il présenter les concepts dans un ordre aléatoire ? (recommandé)
const ORDRE_ALEATOIRE = true;

/* ============================================================
   ▲▲▲  FIN DE LA ZONE À MODIFIER — ne touche pas au reste  ▲▲▲
   ============================================================ */

const app = document.getElementById("app");
let state = { id:"", session:"", start:null, idx:0, order:[], data:{} };

// ---------- utilitaires ----------
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

// ---------- écran d'accueil ----------
function screenIntro(){
  app.innerHTML = "";
  const c = el(`<div class="card">
    <h1>Cartographie mentale</h1>
    <p>Un court exercice de mots. Il n'y a pas de bonne ou de mauvaise réponse : on s'intéresse simplement à ce qui te vient à l'esprit.</p>
    <label>Ton identifiant (ex. tes initiales + jour de naissance)</label>
    <input type="text" id="pid" placeholder="ex. ML14" autocomplete="off">
    <label>Moment</label>
    <div class="valence" id="sess">
      <button data-v="avant" aria-pressed="false">Avant le cours</button>
      <button data-v="apres" aria-pressed="false">Après le cours</button>
    </div>
    <div class="row">
      <button class="btn" id="go" disabled>Commencer</button>
    </div>
    <p class="small">Tes réponses restent sur cet ordinateur jusqu'à ce que tu cliques sur « Enregistrer » à la fin. Rien n'est envoyé automatiquement.</p>
  </div>`);
  app.appendChild(c);

  const pid=c.querySelector("#pid"), go=c.querySelector("#go");
  let sess="";
  c.querySelectorAll("#sess button").forEach(b=>b.onclick=()=>{
    sess=b.dataset.v;
    c.querySelectorAll("#sess button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    check();
  });
  function check(){ go.disabled = !(pid.value.trim() && sess); }
  pid.oninput=check;
  go.onclick=()=>{
    state.id=pid.value.trim(); state.session=sess; state.start=Date.now();
    state.order = ORDRE_ALEATOIRE ? shuffle(CONCEPTS) : [...CONCEPTS];
    state.idx=0;
    screenInstructions();
  };
  pid.focus();
}

// ---------- écran consignes ----------
function screenInstructions(){
  app.innerHTML="";
  app.appendChild(el(`<div class="card">
    <h1>Comment ça marche</h1>
    <p>On va te montrer un mot à la fois. Pour chaque mot, écris les premiers mots qui te viennent — jusqu'à ${NB_ASSOCIATIONS}, spontanément, sans réfléchir longtemps.</p>
    <p>Ensuite, indique si ce mot évoque pour toi quelque chose de plutôt positif, neutre, ou négatif.</p>
    <p>Il y a ${CONCEPTS.length} mots au total. Compte environ 5 minutes.</p>
    <div class="row"><button class="btn" id="start">C'est parti</button></div>
  </div>`));
  document.getElementById("start").onclick=screenCue;
}

// ---------- écran d'un concept ----------
function screenCue(){
  const total=state.order.length, n=state.idx+1;
  const cue=state.order[state.idx];
  const saved = state.data[cue] || {resp:[], valence:""};
  app.innerHTML="";
  const inputs = Array.from({length:NB_ASSOCIATIONS}, (_,i)=>
    `<input type="text" class="assoc" data-i="${i}" placeholder="mot ${i+1}" autocomplete="off" value="${saved.resp[i]?saved.resp[i].replace(/"/g,'&quot;'):''}">`
  ).join("");

  const c = el(`<div class="card">
    <div class="step-lbl">Mot ${n} sur ${total}</div>
    <div class="progress"><i style="width:${(n-1)/total*100}%"></i></div>
    <div class="cue">Quand tu lis ce mot…</div>
    <div class="cueword">${cue}</div>
    <div class="hint">…quels mots te viennent ? (jusqu'à ${NB_ASSOCIATIONS})</div>
    ${inputs}
    <label>Ce mot évoque pour toi quelque chose de…</label>
    <div class="valence" id="val">
      <button data-v="positif" aria-pressed="${saved.valence==='positif'}">positif</button>
      <button data-v="neutre"  aria-pressed="${saved.valence==='neutre'}">neutre</button>
      <button data-v="negatif" aria-pressed="${saved.valence==='negatif'}">négatif</button>
    </div>
    <div class="row">
      ${state.idx>0?'<button class="btn ghost" id="prev">Retour</button>':''}
      <div class="spacer"></div>
      <button class="btn" id="next" disabled>${n===total?'Terminer':'Suivant'}</button>
    </div>
  </div>`);
  app.appendChild(c);

  let valence=saved.valence;
  const next=c.querySelector("#next");
  function save(){
    const resp=Array.from(c.querySelectorAll(".assoc")).map(x=>x.value.trim());
    state.data[cue]={resp, valence};
  }
  function check(){ next.disabled = !valence; } // au moins la valence pour avancer
  c.querySelectorAll("#val button").forEach(b=>b.onclick=()=>{
    valence=b.dataset.v;
    c.querySelectorAll("#val button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    check();
  });
  c.querySelectorAll(".assoc").forEach(x=>x.oninput=save);
  check();

  if(c.querySelector("#prev")) c.querySelector("#prev").onclick=()=>{ save(); state.idx--; screenCue(); };
  next.onclick=()=>{
    save();
    if(state.idx < total-1){ state.idx++; screenCue(); window.scrollTo(0,0); }
    else screenDone();
  };
  const first=c.querySelector(".assoc"); if(first) first.focus();
}

// ---------- écran final + export ----------
function screenDone(){
  app.innerHTML="";
  app.appendChild(el(`<div class="card">
    <div class="done-emoji">✅</div>
    <h1>Terminé, merci !</h1>
    <p>Clique sur le bouton pour enregistrer ta réponse dans un fichier, puis suis la consigne de ton enseignant (le déposer / l'envoyer).</p>
    <div class="row"><button class="btn" id="dl">Enregistrer mon fichier</button></div>
    <p class="small">Le fichier s'appelle <span class="kbd">assoc_${state.id}_${state.session}.csv</span> et se trouve dans ton dossier « Téléchargements ».</p>
  </div>`));
  document.getElementById("dl").onclick=exportCSV;
}

function csvCell(s){ s=(s==null?"":String(s)); return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

function exportCSV(){
  const dur=Math.round((Date.now()-state.start)/1000);
  const cols=["participant","session","horodatage","duree_sec","concept","ordre_presentation"];
  for(let i=1;i<=NB_ASSOCIATIONS;i++) cols.push("association_"+i);
  cols.push("valence");
  const rows=[cols.join(";")];
  state.order.forEach((cue,pos)=>{
    const d=state.data[cue]||{resp:[],valence:""};
    const line=[state.id, state.session, new Date().toISOString(), dur, cue, pos+1];
    for(let i=0;i<NB_ASSOCIATIONS;i++) line.push(d.resp[i]||"");
    line.push(d.valence||"");
    rows.push(line.map(csvCell).join(";"));
  });
  const blob=new Blob(["\uFEFF"+rows.join("\n")], {type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`assoc_${state.id}_${state.session}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

screenIntro();
</script>
</body>
</html>
